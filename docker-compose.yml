x-host-user: &host-user "${HOST_UID:-${SUDO_UID:-1000}}:${HOST_GID:-${SUDO_GID:-1000}}"

x-mpc-party: &mpc-party
  image: proyecto-delta-mpc-party:local
  build:
    context: ..
    dockerfile: proyecto-delta/docker/mp-spdz.Dockerfile
  user: *host-user
  depends_on:
    cert-init:
      condition: service_completed_successfully
    coordinator-api:
      condition: service_healthy
  environment: &party-environment
    COORDINATOR_INTERNAL_URL: http://coordinator-api:8000
    MPC_RUNTIME_ENABLED: "1"
    MPSPDZ_ROOT: /opt/MP-SPDZ
    MPC_HOSTS_FILE: /app/mpc/hosts-docker
    MPC_PROGRAM: ${MPC_PROGRAM:-delta_video_anonymize}
    MPC_LOG_DIR: /tmp/proyecto-delta
    MPC_MAX_WIDTH: ${MPC_MAX_WIDTH:-1920}
    MPC_MAX_HEIGHT: ${MPC_MAX_HEIGHT:-}
  volumes:
    - ./.runtime/Player-Data:/opt/MP-SPDZ/Player-Data:ro
  expose:
    - "5000"
    - "5001"
    - "5002"
  stop_grace_period: 15s

services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase.Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketbase-data:/pb/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  coordinator-api:
    user: *host-user
    build:
      context: .
    command: uvicorn coordinator.main:app --host 0.0.0.0 --port 8000
    environment:
      PARTY_URLS: ${PARTY_URLS:-http://localhost:8100,http://localhost:8101,http://localhost:8102}
      MPC_MAX_WIDTH: ${MPC_MAX_WIDTH:-1920}
      MPC_MAX_HEIGHT: ${MPC_MAX_HEIGHT:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30

  cert-init:
    user: *host-user
    image: proyecto-delta-mpc-party:local
    build:
      context: ..
      dockerfile: proyecto-delta/docker/mp-spdz.Dockerfile
    command: ["/app/mpc/setup-dev-certs.sh", "/runtime"]
    volumes:
      - ./.runtime:/runtime
    restart: "no"

  party-0:
    <<: *mpc-party
    environment:
      <<: *party-environment
      PARTY_ID: "0"
    ports:
      - "8100:8000"
      - "14000:14000"
    volumes:
      - ./.runtime/Player-Data:/opt/MP-SPDZ/Player-Data:ro
      - ./.runtime/logs/party-0:/tmp/proyecto-delta
    healthcheck: &party-healthcheck
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 60

  party-1:
    <<: *mpc-party
    environment:
      <<: *party-environment
      PARTY_ID: "1"
    ports:
      - "8101:8000"
      - "14001:14001"
    volumes:
      - ./.runtime/Player-Data:/opt/MP-SPDZ/Player-Data:ro
      - ./.runtime/logs/party-1:/tmp/proyecto-delta
    healthcheck: *party-healthcheck

  party-2:
    <<: *mpc-party
    environment:
      <<: *party-environment
      PARTY_ID: "2"
    ports:
      - "8102:8000"
      - "14002:14002"
    volumes:
      - ./.runtime/Player-Data:/opt/MP-SPDZ/Player-Data:ro
      - ./.runtime/logs/party-2:/tmp/proyecto-delta
    healthcheck: *party-healthcheck

  client-api:
    user: *host-user
    image: proyecto-delta-mpc-party:local
    build:
      context: ..
      dockerfile: proyecto-delta/docker/mp-spdz.Dockerfile
    command: uvicorn client.local_api:app --host 0.0.0.0 --port 8001
    depends_on:
      party-0:
        condition: service_healthy
      party-1:
        condition: service_healthy
      party-2:
        condition: service_healthy
    environment:
      COORDINATOR_URL: http://coordinator-api:8000
      PARTY_CONTROL_URLS: http://party-0:8000,http://party-1:8000,http://party-2:8000
      MPC_PARTY_HOSTS: party-0,party-1,party-2
      MPC_CERT_DIR: /app/.runtime/Player-Data
      MPSPDZ_ROOT: /opt/MP-SPDZ
      DELTA_OUTPUT_DIR: /app/output
      DELTA_WEB_ORIGINS: ${DELTA_WEB_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}
      DELTA_MAX_UPLOAD_MB: ${DELTA_MAX_UPLOAD_MB:-}
      MPC_MAX_WIDTH: ${MPC_MAX_WIDTH:-1920}
      MPC_MAX_HEIGHT: ${MPC_MAX_HEIGHT:-}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./.runtime/Player-Data:/app/.runtime/Player-Data:ro
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  delta-client:
    user: *host-user
    profiles: ["client"]
    image: proyecto-delta-mpc-party:local
    depends_on:
      party-0:
        condition: service_healthy
      party-1:
        condition: service_healthy
      party-2:
        condition: service_healthy
    entrypoint: ["python", "-m", "client"]
    command: ["--help"]
    working_dir: /workspace
    environment:
      COORDINATOR_URL: http://coordinator-api:8000
      MPC_PARTY_HOSTS: party-0,party-1,party-2
      MPC_CLIENT_PORT_BASE: "14000"
      MPC_CLIENT_ID: "0"
      MPC_CERT_DIR: /workspace/.runtime/Player-Data
      MPSPDZ_ROOT: /opt/MP-SPDZ
      PARTY_CONTROL_URLS: http://party-0:8000,http://party-1:8000,http://party-2:8000
      DELTA_OUTPUT_DIR: /workspace/output
      MPC_MAX_WIDTH: ${MPC_MAX_WIDTH:-1920}
      MPC_MAX_HEIGHT: ${MPC_MAX_HEIGHT:-}
    volumes:
      - .:/workspace

volumes:
  pocketbase-data:
