[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-delta"
version = "0.1.0"
description = "Entrada segura y distribución provisional de secret shares para Proyecto Delta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
]

[project.scripts]
delta = "client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
